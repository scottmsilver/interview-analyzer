app = "interview-analyzer-web"
primary_region = "sjc"

[build]
  # Pass deployment-specific Firebase and API build arguments at deploy time
  # (e.g. via `fly deploy --build-arg ...` or CI secrets), never in this public repo:
  #   VITE_API_URL
  #   VITE_FUNCTIONS_BASE_URL
  #   VITE_FIREBASE_API_KEY
  #   VITE_FIREBASE_AUTH_DOMAIN
  #   VITE_FIREBASE_PROJECT_ID
  #   VITE_FIREBASE_STORAGE_BUCKET
  #   VITE_FIREBASE_MESSAGING_SENDER_ID
  #   VITE_FIREBASE_APP_ID

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

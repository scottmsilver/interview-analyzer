app = "interview-analyzer-api"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 300

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Browser origins allowed to call this API. The frontend is served from
  # Firebase Hosting, which serves the same site on both domains below.
  # Not a secret, so it lives here in version control rather than in fly secrets.
  ALLOWED_ORIGINS = "https://interview-analyzer-prod.web.app,https://interview-analyzer-prod.firebaseapp.com"

  # ANTHROPIC_MODEL is intentionally NOT set here.
  # It is a Fly secret, and secrets override [env]. Keeping a copy in this file
  # would silently drift from the value production actually uses.
  # Change it with: fly secrets set ANTHROPIC_MODEL=<id> -a interview-analyzer-api

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

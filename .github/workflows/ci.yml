name: CI/CD Pipeline
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=moderate
      continue-on-error: true
    - name: Lint code
      run: npm run lint
      continue-on-error: true
    - name: Build project
      run: npm run build
    - name: Check build output
      run: "if [ ! -d \"dist\" ]; then\n  echo \"Build failed - dist directory not created\"\n  exit 1\nfi\necho \"Build successful\
        \ - dist directory created\"\n"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: ./frontend/dist
        retention-days: 7
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: ./backend/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=moderate
      continue-on-error: true
    - name: Lint code
      run: npm run lint
      continue-on-error: true
    - name: Run tests
      run: npm test
      continue-on-error: true
      env:
        NODE_ENV: test
  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Check for sensitive files
      run: "echo \"Checking for sensitive files that should not be committed...\"\n\n# Check if any .env files are tracked\
        \ (except .env.example)\nif git ls-files | grep -E '^\\.env$|\\.env\\.production$|\\.env\\.development$'; then\n \
        \ echo \"ERROR: Environment files found in git tracking!\"\n  exit 1\nfi\n\n# Check for potential API keys in code\n\
        if git grep -E 'ANTHROPIC_API_KEY.*=.*sk-ant-' HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx'; then\n  echo \"ERROR: Potential\
        \ API key found in code!\"\n  exit 1\nfi\n\necho \"No sensitive files detected.\"\n"
    - name: Check for hard-coded URLs
      run: "echo \"Checking for hard-coded server URLs...\"\n\n# This is a basic check - adjust patterns as needed\nif git\
        \ grep -E 'https?://[a-zA-Z0-9.-]+(:[0-9]+)?/api' HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v 'VITE_API_URL';\
        \ then\n  echo \"WARNING: Potential hard-coded server URL found!\"\n  echo \"Please use environment variables instead.\"\
        \nfi\n\necho \"URL check complete.\"\n"
  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Check required documentation exists
      run: "required_docs=(\n  \"README.md\"\n  \"ARCHITECTURE_V2.md\"\n  \"AGENT.md\"\n  \"BRAND_GUIDELINES.md\"\n)\n\nfor\
        \ doc in \"${required_docs[@]}\"; do\n  if [ ! -f \"$doc\" ]; then\n    echo \"ERROR: Required documentation file\
        \ $doc is missing!\"\n    exit 1\n  fi\n  echo \"\u2713 $doc exists\"\ndone\n\necho \"All required documentation files\
        \ present.\"\n"
    - name: Validate markdown formatting
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: '**/*.md'
      continue-on-error: true
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
    - frontend-build
    - backend-build
    - security-check
    - documentation-check
    if: always()
    steps:
    - name: Report status
      run: 'echo "## Build Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- Backend Build: ${{ needs.backend-build.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- Security Check: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- Documentation Check: ${{ needs.documentation-check.result }}" >> $GITHUB_STEP_SUMMARY

        '
